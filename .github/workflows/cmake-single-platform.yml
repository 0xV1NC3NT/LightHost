name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: deps
          key: juce-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DFETCHCONTENT_BASE_DIR="${{ github.workspace }}/deps"
          -DLIGHTHOST_ENABLE_ASIO=ON

      - name: Build (Release)
        run: cmake --build build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LightHost-windows-x64
          path: build/LightHost_artefacts/Release/Light Host.exe
          if-no-files-found: error

      - name: Package release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: >
          Compress-Archive
          -Path "build/LightHost_artefacts/Release/Light Host.exe"
          -DestinationPath "LightHost-${{ github.ref_name }}-windows-x64.zip"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "LightHost-${{ github.ref_name }}-windows-x64.zip" --title "${{ github.ref_name }}" --generate-notes
