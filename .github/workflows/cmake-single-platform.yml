name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: deps
          key: juce-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022" -A x64
          -DFETCHCONTENT_BASE_DIR="${{ github.workspace }}/deps"
          -DLIGHTHOST_ENABLE_ASIO=OFF

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LightHost-windows-x64
          path: build/LightHost_artefacts/Release/Light Host.exe
          if-no-files-found: error
