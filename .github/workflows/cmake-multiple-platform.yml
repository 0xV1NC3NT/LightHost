name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: deps
          key: juce-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DFETCHCONTENT_BASE_DIR="${{ github.workspace }}/deps"
          -DLIGHTHOST_ENABLE_ASIO=ON

      - name: Build (Release)
        run: cmake --build build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LightHost-windows-x64
          path: build/LightHost_artefacts/Release/Light Host.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE download
        uses: actions/cache@v4
        with:
          path: deps
          key: juce-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DFETCHCONTENT_BASE_DIR="${{ github.workspace }}/deps"

      - name: Build (Release)
        run: cmake --build build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LightHost-macos
          path: build/LightHost_artefacts/Release
          if-no-files-found: error

  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        run: |
          cd "artifacts/LightHost-windows-x64"
          zip -r "../../LightHost-${{ github.ref_name }}-windows-x64.zip" "Light Host.exe"
          cd "../LightHost-macos"
          zip -r "../../LightHost-${{ github.ref_name }}-macos.zip" "Light Host.app"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          "LightHost-${{ github.ref_name }}-windows-x64.zip"
          "LightHost-${{ github.ref_name }}-macos.zip"
          --repo "${{ github.repository }}"
          --title "${{ github.ref_name }}" --generate-notes
